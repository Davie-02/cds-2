<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Chimwemwe Driving School2</title>
  <!--
    CUSTOM CONTENT MANAGER
    This page is the whole admin panel: a small, framework-free app
    (admin.js + admin.css) that edits the JSON files in /data.

    - Login: Netlify Identity (invite-only accounts).
    - Saving: Netlify Git Gateway commits each change straight to the
      GitHub repo's main branch; Netlify then redeploys within seconds.
    - Live: every save also updates data/version.json, which open pages
      on the public site watch — they refresh their content by themselves.

    One-time Netlify setup:
      Site configuration → Identity → Enable Identity, set registration to
      "Invite only", then Identity → Services → Enable Git Gateway.
  -->
  <link rel="icon" type="image/png" href="../images/favicon.png" />
  <link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="admin.css?v=1" />
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="../js/vendor/marked-15.0.12.min.js" defer></script>
  <script src="admin.js?v=1" defer></script>
</head>
<body>
  <div id="app"><div class="boot"><span class="spinner"></span></div></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
